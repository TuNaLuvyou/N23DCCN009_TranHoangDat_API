services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bthdv-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - bthdv_mssql_data:/var/opt/mssql

volumes:
  bthdv_mssql_data:
